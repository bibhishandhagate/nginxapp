name: CI/CD Pipeline - Nginx App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Download/Checkout the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Login to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 4. Build and Push Docker Image with multiple tags (latest + commit SHA)
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/nginxapp:latest
          ${{ secrets.DOCKER_USERNAME }}/nginxapp:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    # 5. Connect to EC2 via SSH and deploy the application
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Log into Docker Hub on the server (if private, optional for public repos)
          # docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

          # Stop and remove the old container if it exists
          docker stop nginxapp || true
          docker rm nginxapp || true

          # Pull the latest image from Docker Hub
          docker pull ${{ secrets.DOCKER_USERNAME }}/nginxapp:latest

          # Run the new container mapping port 80 (or 8081 if 80 is occupied)
          docker run -d --name nginxapp -p 80:80 ${{ secrets.DOCKER_USERNAME }}/nginxapp:latest
